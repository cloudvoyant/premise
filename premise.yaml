workspace:
  name: premise
  kind: template-registry
  schema-version: "0.1"
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects: []
templates:
  - name: premise-app
    kind: app
    version: 0.1.0
    questions:
      - prompt: "App name:"
        type: string
        populate: name
    substitutions:
      premise-app: name
  - name: premise-lib
    kind: lib
    version: 0.1.0
    questions:
      - prompt: "Library name:"
        type: string
        populate: name
    substitutions:
      premise-lib: name
