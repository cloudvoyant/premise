workspace:
  name: premise
  kind: monorepo
  schema-version: "0.2"
  package_managers:
    - go
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects:
    - name: premise
      template: cloudvoyant/premise-go:premise-cobra-cli
      path: apps/premise
      package:
        public: false
        main: "."
        binary: premise
    - name: core
      template: cloudvoyant/premise-go:premise-go-lib
      path: libs/core
      package:
        public: true
