workspace:
  name: premise
  kind: template-registry
  schema-version: "0.2"
  package_managers:
    - go
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects: []
template_registry:
  workspace_files: []
  templates:
    - name: premise-app
      kind: app
      path: templates/premise-app
      version: 0.1.0
      questions:
        - prompt: "App name:"
          type: string
          populate: name
      substitutions:
        premise-app: name
    - name: premise-lib
      kind: lib
      path: templates/premise-lib
      version: 0.1.0
      questions:
        - prompt: "Library name:"
          type: string
          populate: name
      substitutions:
        premise-lib: name
