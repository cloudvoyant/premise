name: On Commit

"on":
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  DEPLOY_ENVIRONMENT: preview
  PREVIEW_BRANCH: ${{ github.ref_name }}
  INFRA_BACKEND: ${{ vars.PREMISE_INFRA_BACKEND }}
  DEPLOY_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      runner: ${{ steps.plan.outputs.runner }}
      matrix: ${{ steps.plan.outputs.matrix }}
      native: ${{ steps.plan.outputs.native }}
      version: ${{ steps.plan.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./
        id: plan
        with:
          command: plan
          flow: on-commit
          release: auto
          install-premise: build
      - name: Run the root hook once before matrix rows
        if: steps.plan.outputs.mode == 'matrix'
        uses: ./
        with:
          command: flow
          flow: on-commit
          release: none
          root-only: true
          install-premise: skip

  single:
    needs: plan
    if: needs.plan.outputs.mode == 'single'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run complete flow
        uses: ./
        with:
          command: flow
          flow: on-commit
          release: none
          install-premise: build
          channel: rc
          version: ${{ needs.plan.outputs.version }}
          output-dir: ${{ runner.temp }}/premise-files
      - uses: actions/upload-artifact@v4
        with:
          name: single
          path: ${{ runner.temp }}/premise-files/
          if-no-files-found: ignore
          retention-days: 7

  matrix:
    needs: plan
    if: needs.plan.outputs.mode != 'single'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner || needs.plan.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run scoped complete flow
        uses: ./
        with:
          command: flow-matrix
          flow: on-commit
          release: none
          install-premise: build
          project: ${{ matrix.project }}
          platform: ${{ matrix.platform }}
          skip-root: true
          channel: rc
          version: ${{ needs.plan.outputs.version }}
          output-dir: ${{ runner.temp }}/premise-files
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/premise-files/
          if-no-files-found: ignore
          retention-days: 7

  publish-release:
    needs: [plan, single, matrix]
    outputs:
      version: ${{ needs.plan.outputs.version }}
    if: >-
      always() && needs.plan.outputs.version != '' &&
      needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'single' &&
        needs.single.result == 'success') ||
       (needs.plan.outputs.mode != 'single' &&
        needs.matrix.result == 'success'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: >-
          needs.plan.outputs.mode == 'single' &&
          needs.plan.outputs.native == 'true'
        with:
          name: single
          path: ${{ runner.temp }}/premise-files
      - uses: actions/download-artifact@v4
        if: >-
          needs.plan.outputs.mode == 'matrix' &&
          needs.plan.outputs.native == 'true'
        with:
          pattern: "*-*"
          path: ${{ runner.temp }}/premise-files
          merge-multiple: false
      - name: Keep the release checkout clean
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo '::error::Release checkout is dirty before tagging'
            exit 1
          fi
      - name: Publish combined release
        uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: release
          flow: on-commit
          release: none
          install-premise: build
          channel: rc
          version: ${{ needs.plan.outputs.version }}
          files-dir: ${{ needs.plan.outputs.native == 'true' && format('{0}/premise-files', runner.temp) || '' }}

  publish-packages:
    needs: publish-release
    if: >-
      always() && needs.publish-release.result == 'success' &&
      needs.publish-release.outputs.version != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish registry packages
        uses: ./
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          command: packages
          flow: on-commit
          release: none
          install-premise: build
          channel: rc
          version: ${{ needs.publish-release.outputs.version }}

  provision:
    needs: [plan, single, matrix, publish-release, publish-packages]
    if: >-
      always() && !cancelled() && vars.PREMISE_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'push' && needs.plan.result == 'success' &&
      (needs.single.result == 'success' || needs.matrix.result == 'success') &&
      needs.single.result != 'failure' && needs.matrix.result != 'failure' &&
      needs.publish-release.result != 'failure' && needs.publish-release.result != 'cancelled' &&
      needs.publish-packages.result != 'failure' && needs.publish-packages.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: preview
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_migrations: ${{ steps.plan.outputs.has_migrations }}
      started: ${{ steps.start.outputs.started }}
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./
        with:
          setup-only: true
          release: none
          install-premise: build
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      - uses: aws-actions/configure-aws-credentials@v5
        if: vars.PREMISE_AWS_ROLE != ''
        with:
          role-to-assume: ${{ vars.PREMISE_AWS_ROLE }}
          aws-region: ${{ vars.PREMISE_AWS_REGION }}
      - name: Authenticate infrastructure providers
        run: pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Install client dependencies
        run: |
          pm install
          mise run infra:install
      - name: Pin source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Plan migration jobs
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          args=(deploy plan --json --env "$DEPLOY_ENVIRONMENT")
          if [[ -n "$PREVIEW_BRANCH" ]]; then args+=(--branch "$PREVIEW_BRANCH"); fi
          if [[ -n "$INFRA_BACKEND" ]]; then args+=(--backend "$INFRA_BACKEND"); fi
          pm "${args[@]}" > "$RUNNER_TEMP/deployment-plan.json"
          python3 - "$RUNNER_TEMP/deployment-plan.json" <<'PYCODE'
          import json, os, sys
          plan = json.load(open(sys.argv[1]))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(plan['migration_matrix'], separators=(',', ':')) + '\n')
              output.write('has_migrations=' + str(bool(plan['migrations'])).lower() + '\n')
          PYCODE
      - name: Acquire environment ownership
        id: start
        shell: bash
        env:
          DEPLOY_REVISION: ${{ steps.revision.outputs.sha }}
          DEPLOY_ARTIFACTS: ${{ vars.PREMISE_ARTIFACT_IDENTITIES }}
        run: |
          set -euo pipefail
          args=(--env "$DEPLOY_ENVIRONMENT" --run-id "$DEPLOY_RUN_ID")
          if [[ -n "$PREVIEW_BRANCH" ]]; then args+=(--branch "$PREVIEW_BRANCH"); fi
          if [[ -n "$INFRA_BACKEND" ]]; then args+=(--backend "$INFRA_BACKEND"); fi
          pm deploy start "${args[@]}" --release "$DEPLOY_REVISION" --artifact "$DEPLOY_ARTIFACTS"
          echo 'started=true' >> "$GITHUB_OUTPUT"
      - name: Provision database prerequisites
        shell: bash
        run: |
          set -euo pipefail
          args=(--env "$DEPLOY_ENVIRONMENT" --run-id "$DEPLOY_RUN_ID")
          if [[ -n "$PREVIEW_BRANCH" ]]; then args+=(--branch "$PREVIEW_BRANCH"); fi
          if [[ -n "$INFRA_BACKEND" ]]; then args+=(--backend "$INFRA_BACKEND"); fi
          pm deploy provision "${args[@]}"

  migrate:
    needs: provision
    if: needs.provision.outputs.has_migrations == 'true'
    runs-on: ubuntu-latest
    environment: preview
    strategy:
      # Recovery waits for all workers, including after one worker fails.
      fail-fast: false
      matrix: ${{ fromJSON(needs.provision.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.provision.outputs.revision }}
          persist-credentials: false
      - uses: ./
        with:
          setup-only: true
          release: none
          install-premise: build
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      - uses: aws-actions/configure-aws-credentials@v5
        if: vars.PREMISE_AWS_ROLE != ''
        with:
          role-to-assume: ${{ vars.PREMISE_AWS_ROLE }}
          aws-region: ${{ vars.PREMISE_AWS_REGION }}
      - name: Authenticate infrastructure providers
        run: pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Install client dependencies
        run: |
          pm install
          mise run infra:install
      - name: Migrate one independent group
        shell: bash
        env:
          MIGRATION_GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          args=(--env "$DEPLOY_ENVIRONMENT" --run-id "$DEPLOY_RUN_ID")
          if [[ -n "$PREVIEW_BRANCH" ]]; then args+=(--branch "$PREVIEW_BRANCH"); fi
          if [[ -n "$INFRA_BACKEND" ]]; then args+=(--backend "$INFRA_BACKEND"); fi
          pm deploy migrate "${args[@]}" --group "$MIGRATION_GROUP"

  finish:
    needs: [provision, migrate]
    if: >-
      always() && !cancelled() && needs.provision.result == 'success' &&
      (needs.migrate.result == 'success' ||
       (needs.provision.outputs.has_migrations == 'false' && needs.migrate.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.provision.outputs.revision }}
          persist-credentials: false
      - uses: ./
        with:
          setup-only: true
          release: none
          install-premise: build
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      - uses: aws-actions/configure-aws-credentials@v5
        if: vars.PREMISE_AWS_ROLE != ''
        with:
          role-to-assume: ${{ vars.PREMISE_AWS_ROLE }}
          aws-region: ${{ vars.PREMISE_AWS_REGION }}
      - name: Authenticate infrastructure providers
        run: pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Install client dependencies
        run: |
          pm install
          mise run infra:install
      - name: Apply the full stack and check the release
        shell: bash
        run: |
          set -euo pipefail
          args=(--env "$DEPLOY_ENVIRONMENT" --run-id "$DEPLOY_RUN_ID")
          if [[ -n "$PREVIEW_BRANCH" ]]; then args+=(--branch "$PREVIEW_BRANCH"); fi
          if [[ -n "$INFRA_BACKEND" ]]; then args+=(--backend "$INFRA_BACKEND"); fi
          pm deploy apply "${args[@]}"
          pm deploy complete "${args[@]}"

  recover:
    needs: [provision, migrate, finish]
    if: >-
      always() && needs.provision.outputs.started == 'true' &&
      needs.finish.result != 'success'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.provision.outputs.revision }}
          persist-credentials: false
      - uses: ./
        with:
          setup-only: true
          release: none
          install-premise: build
      - uses: google-github-actions/setup-gcloud@v3
        if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
      - uses: aws-actions/configure-aws-credentials@v5
        if: vars.PREMISE_AWS_ROLE != ''
        with:
          role-to-assume: ${{ vars.PREMISE_AWS_ROLE }}
          aws-region: ${{ vars.PREMISE_AWS_REGION }}
      - name: Authenticate infrastructure providers
        run: pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Install client dependencies
        run: |
          pm install
          mise run infra:install
      - name: Restore the previous application artifacts
        shell: bash
        run: |
          set -euo pipefail
          args=(--env "$DEPLOY_ENVIRONMENT" --run-id "$DEPLOY_RUN_ID")
          if [[ -n "$PREVIEW_BRANCH" ]]; then args+=(--branch "$PREVIEW_BRANCH"); fi
          if [[ -n "$INFRA_BACKEND" ]]; then args+=(--backend "$INFRA_BACKEND"); fi
          pm deploy recover "${args[@]}" --workers-stopped
