---
name: On Commit

"on":
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run on-commit flow
        uses: ./
        with:
          flow: on-commit
          install-premise: build
