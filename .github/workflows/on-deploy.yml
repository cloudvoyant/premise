name: On Deploy

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, stage, prod, preview]
        default: stage
      branch:
        description: Feature branch for a preview
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.environment == 'preview' && (inputs.branch || github.ref_name) || 'persistent' }}
  cancel-in-progress: false

env:
  PM_ENV: ${{ inputs.environment }}
  PREVIEW_BRANCH: ${{ inputs.environment == 'preview' && (inputs.branch || github.ref_name) || '' }}
  PM_BRANCH: ${{ inputs.environment == 'preview' && (inputs.branch || github.ref_name) || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has_infra: ${{ steps.plan.outputs.has_infra }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false
      - uses: ./
        id: plan
        with:
          command: plan
          flow: on-deploy
          install-premise: build

  deploy:
    needs: plan
    if: needs.plan.outputs.has_infra == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false
      - uses: ./
        with:
          setup-only: true
          install-premise: build
      - name: Authenticate infrastructure providers
        run: mise exec -- pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Inspect environment
        id: infrastructure
        run: |
          echo "exists=$(pm infra exists --env "$PM_ENV" --branch "$PM_BRANCH")" >> "$GITHUB_OUTPUT"
          echo "PM_RELEASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare infrastructure
        run: pm infra setup --env "$PM_ENV" --branch "$PM_BRANCH"
      - name: Migrate existing environment
        if: steps.infrastructure.outputs.exists == 'true'
        run: pm migrate --env "$PM_ENV" --branch "$PM_BRANCH"
      - name: Preview infrastructure
        run: pm infra plan --env "$PM_ENV" --branch "$PM_BRANCH"
      - name: Apply infrastructure
        run: pm infra apply --env "$PM_ENV" --branch "$PM_BRANCH" --yes
      - name: Migrate new environment
        if: steps.infrastructure.outputs.exists != 'true'
        run: pm migrate --env "$PM_ENV" --branch "$PM_BRANCH"
      - name: Deploy applications and check health
        run: pm deploy --env "$PM_ENV" --branch "$PM_BRANCH"
