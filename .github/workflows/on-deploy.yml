name: On Deploy

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, stage, prod, preview]
        default: stage
      branch:
        description: Feature branch for a preview
        default: ""
  push:
    branches-ignore: [main]
  delete:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'preview' }}-${{ (inputs.environment == 'preview' || github.event_name != 'workflow_dispatch') && (inputs.branch || github.event.ref || github.ref_name) || 'persistent' }}
  cancel-in-progress: false

jobs:
  legacy:
    if: github.event_name == 'workflow_dispatch' && vars.PREMISE_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        with:
          flow: on-release
          environment: ${{ inputs.environment }}
          install-premise: build

  deploy:
    if: >-
      vars.PREMISE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'preview' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: ./
        with:
          setup-only: true
          install-premise: build
      - name: Build application inputs
        run: mise run '//apps/*:build'
      - name: Provision, migrate, update, and recover on failure
        uses: ./
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        with:
          command: deploy
          release: none
          environment: ${{ inputs.environment || 'preview' }}
          branch: ${{ (inputs.environment == 'preview' || github.event_name == 'push') && (inputs.branch || github.ref_name) || '' }}
          backend: ${{ vars.PREMISE_INFRA_BACKEND }}
          records-url: ${{ vars.PREMISE_RECORDS_URL }}
          deployment-revision: ${{ github.sha }}
          artifact: ${{ vars.PREMISE_ARTIFACT_IDENTITIES }}
          install-premise: skip

  cleanup-preview:
    if: vars.PREMISE_DEPLOY_ENABLED == 'true' && github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Destroy only the deleted branch preview
        uses: ./
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        with:
          command: infra-destroy
          release: none
          environment: preview
          branch: ${{ github.event.ref }}
          backend: ${{ vars.PREMISE_INFRA_BACKEND }}
          install-premise: build
