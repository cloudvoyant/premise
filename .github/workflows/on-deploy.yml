name: On Deploy

"on":
  workflow_dispatch:
    inputs:
      validation:
        description: Run published-RC validation instead of deployment
        type: choice
        options: [none, infra, cloud]
        default: none
      version:
        description: Exact published RC for validation
        type: string
        default: ""
      scenario:
        description: Cloud validation scenario
        type: choice
        options: [parallel, shared, none, fail-migration, fail-apply, rollback]
        default: parallel
      s3:
        description: Include live S3 validation
        type: boolean
        default: false
      environment:
        description: Target environment
        type: choice
        options: [dev, stage, prod, preview]
        default: stage
      branch:
        description: Feature branch for a preview
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  legacy:
    if: inputs.validation == 'none' && vars.PREMISE_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./
        with:
          flow: on-release
          environment: ${{ inputs.environment }}
          install-premise: build

  deploy:
    if: inputs.validation == 'none' && vars.PREMISE_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.environment == 'preview' && (inputs.branch || github.ref_name) || '' }}
      revision: ${{ inputs.branch || github.sha }}
      artifacts: ${{ vars.PREMISE_ARTIFACT_IDENTITIES }}
      backend: ${{ vars.PREMISE_INFRA_BACKEND }}
      install-premise: build

  validate-infra:
    if: inputs.validation == 'infra'
    uses: ./.github/workflows/on-infra-test.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      s3: ${{ inputs.s3 }}

  validate-cloud:
    if: inputs.validation == 'cloud'
    uses: ./.github/workflows/on-infra-deploy-test.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      scenario: ${{ inputs.scenario }}
