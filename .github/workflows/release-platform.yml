name: Premise CI flow

on:
  workflow_call:
    inputs:
      flow:
        required: true
        type: string
      release:
        required: false
        type: string
        default: none
      premise-ref:
        required: false
        type: string
        default: v0
      package-environment:
        required: false
        type: string
        default: ""
    secrets:
      CRATES_TOKEN:
        required: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      runner: ${{ steps.plan.outputs.runner }}
      matrix: ${{ steps.plan.outputs.matrix }}
      native: ${{ steps.plan.outputs.native }}
      version: ${{ steps.plan.outputs.release_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cloudvoyant/premise
          ref: >-
            ${{ github.repository == 'cloudvoyant/premise' &&
                github.sha || inputs.premise-ref }}
          path: .premise-action
          persist-credentials: false
      - uses: ./.premise-action
        id: plan
        with:
          command: plan
          flow: ${{ inputs.flow }}
          release: ${{ inputs.release }}
          install-premise: build
      - name: Run the root hook once before matrix rows
        if: steps.plan.outputs.mode == 'matrix'
        uses: ./.premise-action
        with:
          command: flow
          flow: ${{ inputs.flow }}
          release: none
          root-only: true
          install-premise: skip

  single:
    needs: plan
    if: needs.plan.outputs.mode == 'single'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cloudvoyant/premise
          ref: >-
            ${{ github.repository == 'cloudvoyant/premise' &&
                github.sha || inputs.premise-ref }}
          path: .premise-action
          persist-credentials: false
      - name: Run complete flow
        uses: ./.premise-action
        with:
          command: flow
          flow: ${{ inputs.flow }}
          release: none
          install-premise: build
          channel: ${{ inputs.flow == 'on-commit' && 'rc' || 'stable' }}
          version: ${{ needs.plan.outputs.version }}
          output-dir: ${{ runner.temp }}/premise-files
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single
          path: ${{ runner.temp }}/premise-files/
          if-no-files-found: ignore
          retention-days: 7

  matrix:
    needs: plan
    if: needs.plan.outputs.mode != 'single'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner || needs.plan.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cloudvoyant/premise
          ref: >-
            ${{ github.repository == 'cloudvoyant/premise' &&
                github.sha || inputs.premise-ref }}
          path: .premise-action
          persist-credentials: false
      - name: Run scoped complete flow
        uses: ./.premise-action
        with:
          command: flow-matrix
          flow: ${{ inputs.flow }}
          release: none
          install-premise: build
          project: ${{ matrix.project }}
          platform: ${{ matrix.platform }}
          skip-root: true
          channel: ${{ inputs.flow == 'on-commit' && 'rc' || 'stable' }}
          version: ${{ needs.plan.outputs.version }}
          output-dir: ${{ runner.temp }}/premise-files
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/premise-files/
          if-no-files-found: ignore
          retention-days: 7

  preflight-packages:
    needs: [plan, single, matrix]
    if: >-
      always() && inputs.package-environment != '' &&
      needs.plan.outputs.version != '' &&
      (inputs.release == 'github' || inputs.release == 'auto') &&
      needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'single' &&
        needs.single.result == 'success') ||
       (needs.plan.outputs.mode != 'single' &&
        needs.matrix.result == 'success'))
    runs-on: ubuntu-22.04
    environment: ${{ inputs.package-environment }}
    permissions:
      contents: read
    steps:
      - name: Check registry credential before creating a release
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if [[ -z "$CRATES_TOKEN" ]]; then
            echo '::error::CRATES_TOKEN is unavailable before release'
            exit 1
          fi

  publish-release:
    needs: [plan, single, matrix, preflight-packages]
    outputs:
      version: ${{ needs.plan.outputs.version }}
    if: >-
      always() && needs.plan.outputs.version != '' &&
      (inputs.release == 'github' || inputs.release == 'auto') &&
      (inputs.package-environment == '' ||
        needs.preflight-packages.result == 'success') &&
      needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'single' &&
        needs.single.result == 'success') ||
       (needs.plan.outputs.mode != 'single' &&
        needs.matrix.result == 'success'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: >-
          needs.plan.outputs.mode == 'single' &&
          needs.plan.outputs.native == 'true'
        with:
          name: single
          path: ${{ runner.temp }}/premise-files
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: >-
          needs.plan.outputs.mode == 'matrix' &&
          needs.plan.outputs.native == 'true'
        with:
          pattern: "*-*"
          path: ${{ runner.temp }}/premise-files
          merge-multiple: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cloudvoyant/premise
          ref: >-
            ${{ github.repository == 'cloudvoyant/premise' &&
                github.sha || inputs.premise-ref }}
          path: .premise-action
          persist-credentials: false
      - name: Keep the release checkout clean
        run: |
          printf '\n/.premise-action/\n' >> .git/info/exclude
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo '::error::Release checkout is dirty before tagging'
            exit 1
          fi
      - name: Publish combined release
        uses: ./.premise-action
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: release
          flow: ${{ inputs.flow }}
          release: none
          install-premise: build
          channel: ${{ inputs.flow == 'on-commit' && 'rc' || 'stable' }}
          version: ${{ needs.plan.outputs.version }}
          files-dir: ${{ needs.plan.outputs.native == 'true' && format('{0}/premise-files', runner.temp) || '' }}

  publish-packages:
    needs: publish-release
    if: >-
      always() && needs.publish-release.result == 'success' &&
      needs.publish-release.outputs.version != '' &&
      (inputs.release == 'github' || inputs.release == 'auto')
    runs-on: ubuntu-22.04
    environment: ${{ inputs.package-environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cloudvoyant/premise
          ref: >-
            ${{ github.repository == 'cloudvoyant/premise' &&
                github.sha || inputs.premise-ref }}
          path: .premise-action
          persist-credentials: false
      - name: Publish registry packages
        uses: ./.premise-action
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          command: packages
          flow: ${{ inputs.flow }}
          release: none
          install-premise: build
          channel: ${{ inputs.flow == 'on-commit' && 'rc' || 'stable' }}
          version: ${{ needs.publish-release.outputs.version }}
