name: premise
description: Set up Mise and run one convention-driven Premise CI flow.
author: cloudvoyant
branding:
  icon: package
  color: purple

inputs:
  flow:
    description: "CI flow: on-commit | on-merge | on-release"
    required: false
    default: on-commit
  environment:
    description: "Release environment for on-release: stage | prod"
    required: false
    default: ""
  release:
    description: "Release phase: auto | none | github | packages"
    required: false
    default: auto
  mise-version:
    description: "Mise version to install (defaults to the latest release)"
    required: false
  install-premise:
    description: "Premise installation mode: pre-built | build | skip"
    required: false
    default: pre-built
  premise-version:
    description: "Premise release tag for pre-built mode (defaults to latest)"
    required: false
    default: ""
  cargo-token:
    description: "Cargo registry token forwarded only to the CI launch step"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        CARGO_REGISTRY_TOKEN: ""
        CARGO_TOKEN: ""
        CRATES_TOKEN: ""
      with:
        version: ${{ inputs.mise-version }}

    - name: Install premise
      shell: bash
      env:
        GITHUB_TOKEN: ""
        GH_TOKEN: ""
        CARGO_REGISTRY_TOKEN: ""
        CARGO_TOKEN: ""
        CRATES_TOKEN: ""
        MODE: ${{ inputs.install-premise }}
        VERSION: ${{ inputs.premise-version }}
        INSTALL_DIR: ${{ runner.temp }}/premise-bin
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "$MODE" in
          pre-built)
            mkdir -p "$INSTALL_DIR"
            bash "$ACTION_PATH/install.sh"
            echo "${{ runner.temp }}/premise-bin" >> "$GITHUB_PATH"
            ;;
          build)
            mkdir -p "$INSTALL_DIR"
            (
              cd "$ACTION_PATH"
              mise exec -- go build -o "$INSTALL_DIR/premise" .
            )
            ln -sf premise "$INSTALL_DIR/pm"
            echo "${{ runner.temp }}/premise-bin" >> "$GITHUB_PATH"
            ;;
          skip)
            if ! command -v pm >/dev/null 2>&1; then
              echo "::error::install-premise=skip requires pm on PATH"
              exit 1
            fi
            ;;
          *)
            echo "::error::invalid install-premise mode '$MODE'" \
              "(pre-built | build | skip)"
            exit 1
            ;;
        esac

    - name: Launch CI flow
      shell: bash
      env:
        FLOW: ${{ inputs.flow }}
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        RELEASE_MODE: ${{ inputs.release }}
        CARGO_TOKEN_INPUT: ${{ inputs.cargo-token }}
      run: |
        set -euo pipefail
        if [[ -n "$CARGO_TOKEN_INPUT" ]]; then
          export CARGO_REGISTRY_TOKEN="$CARGO_TOKEN_INPUT"
        fi
        unset CARGO_TOKEN_INPUT
        args=(ci flow "$FLOW" --release "$RELEASE_MODE")
        if [[ -n "$DEPLOY_ENVIRONMENT" ]]; then
          args+=(--environment "$DEPLOY_ENVIRONMENT")
        fi
        pm "${args[@]}"
