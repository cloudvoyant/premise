[env]
_.file = ".env.local"

[tasks."secrets:pull"]
shell = "bash -c"
run = '''
set -euo pipefail
umask 077
git check-ignore --quiet -- .env.local
temporary="$(mktemp .env.local.XXXXXX)"
trap 'rm -f "$temporary"' EXIT
jq -r '"APP_MESSAGE=" + (.message | @json)' "$APP_CONFIG" > "$temporary"
mv "$temporary" .env.local
'''

[tasks."show-message"]
run = 'printf "%s" "$APP_MESSAGE"'
