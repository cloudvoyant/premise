workspace:
  name: generic-no-infra
  kind: monorepo
  schema-version: "0.2"
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects:
    - name: shared
      template: cloudvoyant/premise:premise-lib
      version: 0.1.0
      path: libs/shared
    - name: web
      template: cloudvoyant/premise:premise-app
      version: 0.1.0
      path: apps/web
