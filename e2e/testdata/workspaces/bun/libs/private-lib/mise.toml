[tasks.build]
run = 'echo "private-lib:build"'

[tasks.test]
run = 'echo "private-lib:test"'

[tasks."format:check"]
run = 'echo "private-lib:format:check"'

[tasks.lint]
run = 'echo "private-lib:lint"'

[tasks.publish]
run = 'printf "bun:publish:private-lib:%s\n" "${PREMISE_PUBLISH_VERSION:-}"'

[tasks."publish:rc"]
run = 'printf "bun:publish:rc:private-lib:%s\n" "${PREMISE_PUBLISH_VERSION:-}"'
