[tasks.build]
run = 'echo "cli:build"'

[tasks.test]
run = 'echo "cli:test"'

[tasks."format:check"]
run = 'echo "cli:format:check"'

[tasks.lint]
run = 'echo "cli:lint"'

[tasks."release:build"]
run = '''
mkdir -p "${PREMISE_ARTIFACT_DIR:-dist}"
printf "bun-cli:%s:%s\n" "${PREMISE_RELEASE_CHANNEL:-stable}" "${RELEASE_VERSION:-0.1.0}" > "${PREMISE_ARTIFACT_DIR:-dist}/cli.txt"
'''
