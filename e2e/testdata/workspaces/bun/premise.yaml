workspace:
  name: bun-fixture
  kind: monorepo
  schema-version: "0.2"
  package_managers:
    - bun
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects:
    - name: local-lib
      template: cloudvoyant/premise-bun:bun-lib
      version: 0.1.0
      path: libs/local-lib
    - name: nobuild-lib
      template: cloudvoyant/premise-bun:bun-lib
      version: 0.1.0
      path: libs/nobuild-lib
    - name: public-lib
      template: cloudvoyant/premise-bun:bun-lib
      version: 0.1.0
      path: libs/public-lib
    - name: private-lib
      template: cloudvoyant/premise-bun:bun-lib
      version: 0.1.0
      path: libs/private-lib
    - name: cli
      template: cloudvoyant/premise-bun:bun-app
      version: 0.1.0
      path: apps/cli
      ci:
        release_platforms:
          - linux
          - macos
          - windows
