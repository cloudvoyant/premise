workspace:
  name: cargo-fixture
  kind: monorepo
  schema-version: "0.2"
  package_managers:
    - cargo
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects:
    - name: core
      template: cloudvoyant/premise-cargo:rust-lib
      version: 0.1.0
      path: libs/core
    - name: cli
      template: cloudvoyant/premise-cargo:rust-cli
      version: 0.1.0
      path: apps/cli
      ci:
        release_platforms:
          - linux
          - macos
          - windows
