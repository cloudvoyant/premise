[tasks.build]
run = 'echo "public-lib:build"'

[tasks.test]
run = 'echo "public-lib:test"'

[tasks."format:check"]
run = 'echo "public-lib:format:check"'

[tasks.lint]
run = 'echo "public-lib:lint"'

[tasks.publish]
run = 'printf "go:publish:public-lib:%s\n" "${PREMISE_PUBLISH_VERSION:-}"'

[tasks."publish:rc"]
run = 'printf "go:publish:rc:public-lib:%s\n" "${PREMISE_PUBLISH_VERSION:-}"'
