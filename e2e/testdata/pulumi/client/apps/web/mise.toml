[tasks.build]
run = '../../tasks/static.sh build'

[tasks.test]
run = '../../tasks/static.sh test'

[tasks."format:check"]
run = '../../tasks/static.sh format:check'

[tasks.lint]
run = '../../tasks/static.sh lint'

[tasks.migrate]
run = '../../tasks/static.sh migrate'

[tasks.deploy]
run = '../../tasks/static.sh deploy'

[tasks.health]
run = '../../tasks/static.sh health'

[tasks.rollback]
run = '../../tasks/static.sh rollback'

[tasks."secrets:pull"]
shell = "bash -c"
run = '''
set -euo pipefail
umask 077
git check-ignore --quiet -- .env.local
args=(--env "$PM_ENV")
if [[ "$PM_ENV" == preview ]]; then args+=(--branch "$PM_BRANCH"); fi
bucket="$(pm infra query "${args[@]}" --output bucketName)"
temporary="$(mktemp .env.local.XXXXXX)"
trap 'rm -f "$temporary"' EXIT
jq -r --arg bucket "$bucket" '
  "APP_MESSAGE=" + (.message | @json),
  "BUCKET_NAME=" + ($bucket | @json)
' "$APP_CONFIG" > "$temporary"
mv "$temporary" .env.local
'''

[tasks."release:build"]
run = "../../tasks/static.sh release:build"
