[tasks."build"]
shell = "bash -c"
run = '''
set -euo pipefail
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'build' '' "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
test -s "releases/${PM_RELEASE:-A}/index.html"
'''

[tasks."test"]
shell = "bash -c"
run = '''
set -euo pipefail
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'test' '' "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
if [[ "${PREMISE_TEST_FAIL_TASK:-}" == 'test' ]]; then
    echo 'requested test failure' >&2
    exit 1
fi
test -s "releases/${PM_RELEASE:-A}/index.html"
'''

[tasks."format:check"]
shell = "bash -c"
run = '''
set -euo pipefail
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'format:check' '' "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
test -s "releases/${PM_RELEASE:-A}/index.html"
'''

[tasks."lint"]
shell = "bash -c"
run = '''
set -euo pipefail
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'lint' '' "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
test -s "releases/${PM_RELEASE:-A}/index.html"
'''

[tasks."release:build"]
shell = "bash -c"
run = '''
set -euo pipefail
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'release:build' '' "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
if [[ "${PREMISE_TEST_FAIL_TASK:-}" == 'release:build' ]]; then
    echo 'requested release:build failure' >&2
    exit 1
fi
cp "releases/${PM_RELEASE:-A}/index.html" "$PREMISE_ARTIFACT_DIR/index.html"
printf '%s:%s\n' "$PREMISE_RELEASE_CHANNEL" "$RELEASE_VERSION" > "$PREMISE_ARTIFACT_DIR/version.txt"
'''

[tasks."migrate"]
shell = "bash -c"
usage = 'arg "<environment>"'
run = '''
set -euo pipefail
environment="$usage_environment"
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'migrate' "$environment" "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
args=(--env "$environment")
if [[ "$environment" == preview ]]; then args+=(--branch "$PM_BRANCH"); fi
bucket="$(pm infra query "${args[@]}" --output bucketName)"
printf '%s:%s\n' "$environment" "$PM_RELEASE" | gcloud storage cp - "gs://$bucket/schema-version.txt"
'''

[tasks."deploy"]
shell = "bash -c"
usage = 'arg "<environment>"'
run = '''
set -euo pipefail
environment="$usage_environment"
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'deploy' "$environment" "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
args=(--env "$environment")
if [[ "$environment" == preview ]]; then args+=(--branch "$PM_BRANCH"); fi
bucket="$(pm infra query "${args[@]}" --output bucketName)"
gcloud storage cp "releases/$PM_RELEASE/index.html" "gs://$bucket/index.html"
'''

[tasks."health"]
shell = "bash -c"
usage = 'arg "<environment>"'
run = '''
set -euo pipefail
environment="$usage_environment"
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'health' "$environment" "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
args=(--env "$environment")
if [[ "$environment" == preview ]]; then args+=(--branch "$PM_BRANCH"); fi
bucket="$(pm infra query "${args[@]}" --output bucketName)"
gcloud storage cat "gs://$bucket/index.html" | grep -Fx "<h1>Release $PM_RELEASE</h1>"
[[ "${PREMISE_TEST_FAIL_HEALTH:-}" != "$environment" ]]
'''

[tasks."rollback"]
shell = "bash -c"
usage = 'arg "<environment>"'
run = '''
set -euo pipefail
environment="$usage_environment"
if [[ -n "${PREMISE_TEST_EVENTS:-}" ]]; then
    printf '%s:%s:%s\n' 'rollback' "$environment" "${PM_RELEASE:-A}" >> "$PREMISE_TEST_EVENTS"
fi
args=(--env "$environment")
if [[ "$environment" == preview ]]; then args+=(--branch "$PM_BRANCH"); fi
bucket="$(pm infra query "${args[@]}" --output bucketName)"
# Creation time determines version order; generation IDs are only unique.
previous="$(gcloud storage ls --all-versions --long "gs://$bucket/index.html" | awk '$3 ~ /^gs:/ {print $2, $3}' | sort -r | sed -n '2s/^[^ ]* //p')"
[[ -n "$previous" ]]
gcloud storage cp "$previous" "gs://$bucket/index.html"
'''

[tasks."secrets:pull"]
shell = "bash -c"
run = '''
set -euo pipefail
umask 077
git check-ignore --quiet -- .env.local
args=(--env "$PM_ENV")
if [[ "$PM_ENV" == preview ]]; then args+=(--branch "$PM_BRANCH"); fi
bucket="$(pm infra query "${args[@]}" --output bucketName)"
temporary="$(mktemp .env.local.XXXXXX)"
trap 'rm -f "$temporary"' EXIT
jq -r --arg bucket "$bucket" '
  "APP_MESSAGE=" + (.message | @json),
  "BUCKET_NAME=" + ($bucket | @json)
' "$APP_CONFIG" > "$temporary"
mv "$temporary" .env.local
'''
