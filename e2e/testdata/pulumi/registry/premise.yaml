workspace:
  name: gcs-test-templates
  kind: template-registry
  schema-version: "0.2"
  providers: { ci: github, tools: mise, tasks: mise, infra: pulumi, versioning: svu }
  projects: []
template_registry:
  workspace_files: []
  templates:
    - name: bucket
      kind: infra
      path: templates/bucket
      infra: { role: program, scope: environment }
      questions:
        - prompt: Infrastructure project name
          type: string
          populate: name
      substitutions:
        premise-gcs-fixture: name
