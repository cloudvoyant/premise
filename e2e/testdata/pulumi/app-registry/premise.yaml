workspace:
  name: premise-pulumi
  kind: template-registry
  schema-version: "0.2"
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects: []
template_registry:
  workspace_files: []
  templates:
    - name: static-app
      kind: app
      path: templates/app
      version: 0.1.0
      questions:
        - prompt: "Infrastructure project name (shared for shared infrastructure):"
          type: string
          populate: name
      substitutions:
        fixture-app: name
