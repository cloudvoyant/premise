workspace:
  name: deployment-client
  kind: monorepo
  schema-version: "0.2"
  providers: { ci: github, tools: mise, tasks: mise, infra: pulumi, versioning: svu }
  infra:
    directory: infra
    prerequisites: ["*::api-database", "*::worker-database"]
  deployment:
    records: .premise/releases
    applications:
      - { project: api, health: health, rollback: rollback }
      - { project: worker, health: health, rollback: rollback }
      - { project: website, health: health, rollback: rollback }
    recovery:
      first_deploy: { project: api, task: cleanup }
  projects:
    - { name: api, template: fixture:app, path: apps/api }
    - { name: worker, template: fixture:app, path: apps/worker }
    - { name: website, template: fixture:app, path: apps/website }
