[tools]
bun = "1.4.2"

[tasks."install"]
run = '''
bun install --ignore-scripts
'''

[tasks."build"]
run = '''
bun build src/index.ts --target=bun --outdir=dist
'''

[tasks."test"]
run = '''
bun test
'''

[tasks."lint"]
run = '''
bun build src/index.ts --target=bun --outdir=dist
'''

[tasks."lint:fix"]
run = '''
bun test
'''

[tasks."format"]
run = '''
echo no formatter dependency needed
'''

[tasks."format:check"]
run = '''
echo native fixture formatting checked
'''

[tasks."clean"]
run = '''
rm -rf dist
'''

[tasks."env-pull"]
run = '''
echo no secrets
'''

[tasks."publish:rc"]
run = '''
echo local fixture has no registry
'''

[tasks."publish"]
run = '''
echo local fixture has no registry
'''
