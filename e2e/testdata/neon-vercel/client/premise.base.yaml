workspace:
  name: live-client
  kind: monorepo
  schema-version: "0.2"
  providers: { ci: github, tools: mise, tasks: mise, infra: pulumi, versioning: svu }
  infra:
    directory: infra
    providers: [gcp, neon, vercel]
    backend: validation
    backends:
      validation: { url: "gs://cloudvoyant-premise-pulumi-state-547304404433/premise-validation" }
    prerequisites:
      [
        "*::api-branch",
        "*::api-endpoint",
        "*::api-role",
        "*::api-database",
        "*::worker-branch",
        "*::worker-endpoint",
        "*::worker-role",
        "*::worker-database",
      ]
    environments:
      preview:
        config:
          client:neonProjectId: bitter-river-81933503
          client:neonParentId: br-winter-mud-b5pqfxms
          client:vercelProjectId: prj_MsMfmDj4vMZM1RnTMfsSw7CF1rXQ
          client:vercelTeamId: team_18gyVULDM7SQHEIxvCMQz2PI
          client:aliasPrefix: pm
          client:scenario: SCENARIO
  deployment:
    applications:
      - { project: api, health: health, rollback: rollback }
      - { project: worker, health: health, rollback: rollback }
      - { project: web, health: health, rollback: rollback }
    record_outputs: [deploymentId, applicationUrl]
    recovery:
      first_deploy: { project: web, task: cleanup }
  projects:
    - { name: api, template: fixture:api, path: apps/api }
    - { name: worker, template: fixture:worker, path: apps/worker }
    - { name: web, template: "cloudvoyant/premise-bun:premise-tanstack-start-app", path: apps/web }
