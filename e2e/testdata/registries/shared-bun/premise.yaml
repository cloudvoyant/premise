workspace:
  name: bun
  kind: template-registry
  schema-version: "0.2"
  package_managers:
    - bun
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects: []
template_registry:
  workspace_files:
    - .gitignore
    - .gitattributes
    - mise.toml
    - package.json
  templates:
    - name: hono-api
      kind: app
      path: templates/hono-api
      version: 0.2.0
      questions:
        - prompt: "API name:"
          type: string
          populate: name
      substitutions:
        hono-api: name
