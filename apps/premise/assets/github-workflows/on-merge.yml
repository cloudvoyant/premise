name: On Merge

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  delete:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'push' && 'stable-release' || format('deploy-preview-{0}', github.event.pull_request.head.ref || github.event.ref) }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      runner: ${{ steps.plan.outputs.runner }}
      matrix: ${{ steps.plan.outputs.matrix }}
      native: ${{ steps.plan.outputs.native }}
      has_infra: ${{ steps.plan.outputs.has_infra }}
      version: ${{ steps.plan.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: cloudvoyant/premise@v0
        id: plan
        with:
          command: plan
          flow: on-merge
          release: ${{ github.event_name == 'push' && 'auto' || 'none' }}
          install-premise: build
      - name: Run the root hook once before matrix rows
        if: github.event_name == 'push' && steps.plan.outputs.mode == 'matrix'
        uses: cloudvoyant/premise@v0
        with:
          command: flow
          flow: on-merge
          release: none
          root-only: true
          install-premise: skip

  single:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.mode == 'single'
    runs-on: ${{ needs.plan.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run complete flow
        uses: cloudvoyant/premise@v0
        with:
          command: flow
          flow: on-merge
          release: none
          install-premise: build
          channel: stable
          version: ${{ needs.plan.outputs.version }}
          output-dir: ${{ runner.temp }}/premise-files
      - uses: actions/upload-artifact@v4
        with:
          name: single
          path: ${{ runner.temp }}/premise-files/
          if-no-files-found: ignore
          retention-days: 7

  matrix:
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.mode != 'single'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner || needs.plan.outputs.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run scoped complete flow
        uses: cloudvoyant/premise@v0
        with:
          command: flow-matrix
          flow: on-merge
          release: none
          install-premise: build
          project: ${{ matrix.project }}
          platform: ${{ matrix.platform }}
          skip-root: true
          channel: stable
          version: ${{ needs.plan.outputs.version }}
          output-dir: ${{ runner.temp }}/premise-files
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/premise-files/
          if-no-files-found: ignore
          retention-days: 7

  preflight-packages:
    needs: [plan, single, matrix]
    if: >-
      always() &&
      needs.plan.outputs.version != '' &&
      needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'single' &&
        needs.single.result == 'success') ||
       (needs.plan.outputs.mode != 'single' &&
        needs.matrix.result == 'success'))
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check registry credential before creating a release
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if [[ -z "$CRATES_TOKEN" ]]; then
            echo '::error::CRATES_TOKEN is unavailable before release'
            exit 1
          fi

  publish-release:
    needs: [plan, single, matrix, preflight-packages]
    outputs:
      version: ${{ needs.plan.outputs.version }}
    if: >-
      always() && needs.plan.outputs.version != '' &&
      needs.preflight-packages.result == 'success' &&
      needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'single' &&
        needs.single.result == 'success') ||
       (needs.plan.outputs.mode != 'single' &&
        needs.matrix.result == 'success'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: >-
          needs.plan.outputs.mode == 'single' &&
          needs.plan.outputs.native == 'true'
        with:
          name: single
          path: ${{ runner.temp }}/premise-files
      - uses: actions/download-artifact@v4
        if: >-
          needs.plan.outputs.mode == 'matrix' &&
          needs.plan.outputs.native == 'true'
        with:
          pattern: "*-*"
          path: ${{ runner.temp }}/premise-files
          merge-multiple: false
      - name: Keep the release checkout clean
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo '::error::Release checkout is dirty before tagging'
            exit 1
          fi
      - name: Publish combined release
        uses: cloudvoyant/premise@v0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          command: release
          flow: on-merge
          release: none
          install-premise: build
          channel: stable
          version: ${{ needs.plan.outputs.version }}
          files-dir: ${{ needs.plan.outputs.native == 'true' && format('{0}/premise-files', runner.temp) || '' }}

  publish-packages:
    needs: publish-release
    if: >-
      always() && needs.publish-release.result == 'success' &&
      needs.publish-release.outputs.version != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish registry packages
        uses: cloudvoyant/premise@v0
        env:
          GH_TOKEN: ${{ github.token }}
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        with:
          command: packages
          flow: on-merge
          release: none
          install-premise: build
          channel: stable
          version: ${{ needs.publish-release.outputs.version }}

  cleanup-preview:
    needs: plan
    permissions:
      contents: read
      id-token: write
    if: >-
      needs.plan.outputs.has_infra == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'))
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: cloudvoyant/premise@v0
        with:
          setup-only: true
          install-premise: pre-built
      - name: Authenticate infrastructure providers
        run: mise exec -- pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Destroy the merged or deleted branch preview
        uses: cloudvoyant/premise@v0
        with:
          command: infra-destroy
          environment: preview
          branch: ${{ github.event.pull_request.head.ref || github.event.ref }}
          install-premise: skip

  deploy-dev:
    needs: [plan, single, matrix, publish-release, publish-packages]
    if: >-
      always() && !cancelled() && needs.plan.outputs.has_infra == 'true' &&
      github.event_name == 'push' && needs.plan.result == 'success' &&
      (needs.single.result == 'success' || needs.matrix.result == 'success') &&
      needs.single.result != 'failure' && needs.matrix.result != 'failure' &&
      needs.publish-release.result != 'failure' && needs.publish-release.result != 'cancelled' &&
      needs.publish-packages.result != 'failure' && needs.publish-packages.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-persistent
      cancel-in-progress: false
    environment: dev
    env:
      PM_ENV: dev
      PM_BRANCH: ""
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cloudvoyant/premise@v0
        with:
          setup-only: true
          install-premise: pre-built
      - name: Authenticate infrastructure providers
        run: mise exec -- pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Inspect environment
        id: infrastructure
        run: |
          echo "exists=$(pm infra exists --env "$PM_ENV" --branch "$PM_BRANCH")" >> "$GITHUB_OUTPUT"
          echo "PM_RELEASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prepare infrastructure
        run: pm infra setup --env "$PM_ENV" --branch "$PM_BRANCH"
      - name: Migrate existing environment
        if: steps.infrastructure.outputs.exists == 'true'
        run: pm migrate --env "$PM_ENV" --branch "$PM_BRANCH"
      - name: Preview infrastructure
        run: pm infra plan --env "$PM_ENV" --branch "$PM_BRANCH"
      - name: Apply infrastructure
        run: pm infra apply --env "$PM_ENV" --branch "$PM_BRANCH" --yes
      - name: Migrate new environment
        if: steps.infrastructure.outputs.exists != 'true'
        run: pm migrate --env "$PM_ENV" --branch "$PM_BRANCH"
      - name: Deploy applications and check health
        run: pm deploy --env "$PM_ENV" --branch "$PM_BRANCH"
