[env]
GOWORK = "off"
PREMISE_TEST_FNOX = "1"

[tools]
go = "1.25.14"
golangci-lint = "2.15.0"
fnox = "1.39.0"

[tasks."install"]
run = "go mod download all"

[tasks."build"]
run = "go build -o dist/premise ."

[tasks."clean"]
run = "rm -rf dist"

[tasks."test"]
run = "go test ./... ../../e2e"

[tasks."lint"]
run = "golangci-lint run"

[tasks."lint:fix"]
run = "golangci-lint run --fix"

[tasks."format"]
run = "golangci-lint fmt"

[tasks."format:check"]
run = "golangci-lint fmt --diff"

[tasks."env-pull"]
run = "echo \"env-pull: nothing to pull\""

[tasks."publish"]
run = "go test ./..."

[tasks."publish:rc"]
run = "go test ./..."

[tasks."run"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = 1 ]; then go test ./...; else go run .; fi
'''

[tasks."dev"]
run = '''
set -eu
if [ "${PREMISE_TEMPLATE_TEST:-}" = 1 ]; then go test ./...; else go run .; fi
'''

[tasks."deploy"]
run = "echo \"Configure deployment for your environment; no cloud resources provisioned\""

[tasks."e2e"]
run = '''
set -eu
go test ../../e2e -run "Test"
'''
