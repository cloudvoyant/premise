# =============================================================================
# mise.toml - premise development environment and tasks
# =============================================================================

monorepo_root = true

[env]
_.path = ['{{config_root}}/bin', '{{config_root}}/node_modules/.bin']
PROJECT = "premise"
GOWORK = "off"

[monorepo]
config_roots = ["apps/*", "libs/*"]

[tools]
# Matches the `go` directive in go.mod (testscript/go-internal requires 1.25+).
go = "1.25"
golangci-lint = "2.15.0"
node = "lts"
"npm:prettier" = "latest"
shellcheck = "latest"
shfmt = "latest"
watchexec = "latest"
fnox = "1.39.0"
actionlint = "1.7.12"
"go:github.com/fzipp/gocyclo/cmd/gocyclo" = "0.6.0"

[tasks.install]
description = "Install the premise CLI"
run = "go install ./apps/premise"

[tasks.build]
description = "Build the premise CLI"
sources = [
  "apps/premise/**/*.go",
  "apps/premise/assets/**/*.toml",
  "apps/premise/assets/**/*.yml",
  "libs/core/**/*.go",
  "go.mod",
  "go.sum",
]
run = '''
go build ./...
mkdir -p bin
go build -o "bin/$PROJECT" ./apps/premise
ln -sfn "$PROJECT" bin/pm
echo "Build successful -> bin/$PROJECT (pm)"
'''

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.test.env]
PREMISE_TEST_FNOX = "1"

[tasks.e2e]
description = "Run end-to-end tests"
run = "go test ./e2e"

[tasks."e2e:infra"]
description = "Run live scaffold, infrastructure, and CI scenarios against GCS"
run = "go test ./e2e -run '^(TestScaffold|TestInfra|TestCI)$' -count=1 -timeout 45m -v"

[tasks."e2e:infra".env]
PREMISE_TEST_GCS = "1"

[tasks.dev]
description = "Watch sources and rebuild bin/premise (and pm) on change"
run = "mise watch build"

[tasks.format]
description = "Format Go, shell, and documentation files"
run = '''
gofmt -w .
shfmt -w install.sh
if command -v prettier >/dev/null 2>&1; then
  prettier --write .
else
  echo "prettier not found - run 'pm install' to format non-Go files" >&2
fi
'''

[tasks."format:check"]
description = "Check formatting without modifying files"
run = '''
status=0
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "Unformatted Go files:" >&2
  echo "$unformatted" >&2
  status=1
fi
shfmt -d install.sh || status=1
if command -v prettier >/dev/null 2>&1; then
  prettier --check . || status=1
else
  echo "prettier not found - run 'pm install' to check non-Go files" >&2
fi
exit "$status"
'''

[tasks.lint]
description = "Run Go and shell static analysis"
run = '''
go vet ./...
gocyclo -over 30 -ignore '_test\.go$' libs/core/backends libs/core/merge.go libs/core/misex.go libs/core/generate.go
shellcheck install.sh
'''

[tasks."publish:update-action-tags"]
description = "Move the major action tag to the published stable release"
shell = "bash -c"
run = '''
set -euo pipefail
if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
  echo "publish:update-action-tags requires a stable RELEASE_VERSION such as v0.6.0" >&2
  exit 1
fi
major="${RELEASE_VERSION%%.*}"
target=$(gh api "repos/cloudvoyant/premise/git/ref/tags/$RELEASE_VERSION" --jq '.object.sha')
if gh api "repos/cloudvoyant/premise/git/ref/tags/$major" --silent; then
  gh api --method PATCH "repos/cloudvoyant/premise/git/refs/tags/$major" -f sha="$target" -F force=true
else
  gh api --method POST repos/cloudvoyant/premise/git/refs -f ref="refs/tags/$major" -f sha="$target"
fi
'''

[tasks."publish:rc"]
description = "Report Git-tag publication for Go source"
run = 'echo "Go source uses the shared repository RC tag; no registry upload is needed."'

[tasks."lint:fix"]
description = "Apply safe formatting fixes, then run static analysis"
run = '''
gofmt -w .
shfmt -w install.sh
go vet ./...
gocyclo -over 30 -ignore '_test\.go$' libs/core/backends libs/core/merge.go libs/core/misex.go libs/core/generate.go
shellcheck install.sh
'''
