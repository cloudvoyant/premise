# =============================================================================
# mise.toml - premise development environment and tasks
# =============================================================================

[env]
_.path = ['{{config_root}}/bin', '{{config_root}}/node_modules/.bin']
PROJECT = "premise"

[tools]
# Matches the `go` directive in go.mod (testscript/go-internal requires 1.25+).
go = "1.25"
node = "lts"
"npm:prettier" = "latest"
shellcheck = "latest"
shfmt = "latest"
watchexec = "latest"

[tasks.install]
description = "Install the premise CLI"
run = "go install"

[tasks.build]
description = "Build the premise CLI"
sources = [
  "main.go",
  "cmd/**/*.go",
  "core/**/*.go",
  "assets/**/*.toml",
  "templates/**/*.toml",
  "go.mod",
  "go.sum",
]
run = '''
go build ./...
mkdir -p bin
go build -o "bin/$PROJECT" .
ln -sfn "$PROJECT" bin/pm
echo "Build successful -> bin/$PROJECT (pm)"
'''

[tasks.test]
description = "Run all Go tests"
run = "go test ./..."

[tasks.e2e]
description = "Run end-to-end tests"
run = "go test ./e2e"

[tasks.dev]
description = "Watch sources and rebuild bin/premise (and pm) on change"
run = "mise watch build"

[tasks.format]
description = "Format Go, shell, and documentation files"
run = '''
gofmt -w .
shfmt -w install.sh
if command -v prettier >/dev/null 2>&1; then
  prettier --write .
else
  echo "prettier not found - run 'pm install' to format non-Go files" >&2
fi
'''

[tasks."format:check"]
description = "Check formatting without modifying files"
run = '''
status=0
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "Unformatted Go files:" >&2
  echo "$unformatted" >&2
  status=1
fi
shfmt -d install.sh || status=1
if command -v prettier >/dev/null 2>&1; then
  prettier --check . || status=1
else
  echo "prettier not found - run 'pm install' to check non-Go files" >&2
fi
exit "$status"
'''

[tasks.lint]
description = "Run Go and shell static analysis"
run = '''
go vet ./...
shellcheck install.sh
'''

[tasks."publish:rc"]
description = "Opt-in RC publication for Go (no-op; Go supports prerelease installs through commit hashes)"
run = 'echo "Skipping RC publish: Go supports prerelease installs through commit hashes."'

[tasks."lint:fix"]
description = "Apply safe formatting fixes, then run static analysis"
run = '''
gofmt -w .
shfmt -w install.sh
go vet ./...
shellcheck install.sh
'''

[tasks."on-commit"]
description = "Validate Premise and its native template registry"
run = '''
pm install
mise run build
mise run test
mise run format:check
mise run lint
mise run e2e
pm template test
'''

[tasks."on-merge"]
description = "Validate Premise before stable publication"
run = "mise run on-commit"

[tasks."on-release"]
description = "Report that Premise has no deployment target"
run = 'echo "No Premise deployment target — nothing to do."'
