name: On Deploy

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, stage, prod, preview]
        default: stage
      branch:
        description: Feature branch for a preview
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}-${{ inputs.environment == 'preview' && (inputs.branch || github.ref_name) || 'persistent' }}
  cancel-in-progress: false

env:
  DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
  PREVIEW_BRANCH: ${{ inputs.environment == 'preview' && (inputs.branch || github.ref_name) || '' }}
  PM_BRANCH: ${{ inputs.environment == 'preview' && (inputs.branch || github.ref_name) || '' }}
  INFRA_BACKEND: ${{ vars.PREMISE_INFRA_BACKEND }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  legacy:
    if: vars.PREMISE_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cloudvoyant/premise@v0.5.0-rc.261
        with:
          flow: on-deploy
          environment: ${{ inputs.environment }}
          premise-version: v0.5.0-rc.261
          install-premise: pre-built

  deploy:
    if: vars.PREMISE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false
      - uses: cloudvoyant/premise@v0.5.0-rc.261
        with:
          setup-only: true
          release: none
          premise-version: v0.5.0-rc.261
          install-premise: pre-built
      - name: Authenticate infrastructure providers
        run: pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Run environment flow
        env:
          PM_ARTIFACTS: ${{ vars.PREMISE_ARTIFACT_IDENTITIES }}
        run: |
          PM_RELEASE="$(git rev-parse HEAD)"
          export PM_RELEASE
          args=(ci flow on-deploy --environment "$DEPLOY_ENVIRONMENT" --release none)
          if [[ -n "$INFRA_BACKEND" ]]; then args+=(--backend "$INFRA_BACKEND"); fi
          pm "${args[@]}"
