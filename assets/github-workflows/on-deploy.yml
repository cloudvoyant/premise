name: On Deploy

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, stage, prod, preview]
        default: stage
      branch:
        description: Feature branch for a preview
        default: ""
  push:
    branches-ignore: [main]
  delete:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'preview' }}-${{ (inputs.environment == 'preview' || github.event_name != 'workflow_dispatch') && (inputs.branch || github.event.pull_request.head.ref || (github.event_name == 'delete' && github.event.ref) || github.ref_name) || 'persistent' }}
  cancel-in-progress: false

jobs:
  legacy:
    if: github.event_name == 'workflow_dispatch' && vars.PREMISE_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cloudvoyant/premise@v0.5.0-rc.243
        with:
          flow: on-release
          environment: ${{ inputs.environment }}
          premise-version: v0.5.0-rc.243
          install-premise: pre-built

  deploy:
    if: >-
      vars.PREMISE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'preview' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.sha }}
          persist-credentials: false
      - uses: cloudvoyant/premise@v0.5.0-rc.243
        with:
          setup-only: true
          premise-version: v0.5.0-rc.243
          install-premise: pre-built
      - name: Authenticate infrastructure providers
        run: pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Build application inputs
        run: mise run '//apps/*:build'
      - name: Provision, migrate, update, and recover on failure
        uses: cloudvoyant/premise@v0.5.0-rc.243
        with:
          command: deploy
          release: none
          environment: ${{ inputs.environment || 'preview' }}
          branch: ${{ (inputs.environment == 'preview' || github.event_name == 'push') && (inputs.branch || github.ref_name) || '' }}
          backend: ${{ vars.PREMISE_INFRA_BACKEND }}
          secrets-provider: ${{ vars.PREMISE_SECRETS_PROVIDER }}
          records-url: ${{ vars.PREMISE_RECORDS_URL }}
          deployment-revision: ${{ github.sha }}
          artifact: ${{ vars.PREMISE_ARTIFACT_IDENTITIES }}
          install-premise: skip

  cleanup-preview:
    if: >-
      vars.PREMISE_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'))
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: cloudvoyant/premise@v0.5.0-rc.243
        with:
          setup-only: true
          premise-version: v0.5.0-rc.243
          install-premise: pre-built
      - name: Authenticate infrastructure providers
        run: pm infra auth --ci --env-file "$GITHUB_ENV"
      - name: Destroy the merged or deleted branch preview
        uses: cloudvoyant/premise@v0.5.0-rc.243
        with:
          command: infra-destroy
          release: none
          environment: preview
          branch: ${{ github.event.pull_request.head.ref || github.event.ref }}
          backend: ${{ vars.PREMISE_INFRA_BACKEND }}
          secrets-provider: ${{ vars.PREMISE_SECRETS_PROVIDER }}
          install-premise: skip
