name: On Deploy

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, stage, prod, preview]
        default: stage
      branch:
        description: Feature branch for a preview
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  legacy:
    if: vars.PREMISE_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cloudvoyant/premise@v0.5.0-rc.243
        with:
          flow: on-release
          environment: ${{ inputs.environment }}
          premise-version: v0.5.0-rc.243
          install-premise: pre-built

  deploy:
    if: vars.PREMISE_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deployment.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      branch: ${{ inputs.environment == 'preview' && (inputs.branch || github.ref_name) || '' }}
      revision: ${{ inputs.branch || github.sha }}
      artifacts: ${{ vars.PREMISE_ARTIFACT_IDENTITIES }}
      backend: ${{ vars.PREMISE_INFRA_BACKEND }}
      install-premise: pre-built
      premise-version: v0.5.0-rc.243
